<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Cyber-Shield | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-color: #050b14;
            --accent-color: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.5);
            --text-color: #c9d1d9;
            --terminal-green: #3fb950;
            --danger-red: #ff4a4a;
            --warning-yellow: #e3b341;
            --bg-card: #151A27;
        }

        body {
            background: radial-gradient(circle at top, #0d1726, var(--bg-color));
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            min-height: 100vh;
            margin: 0;
        }

        .container { width: 100%; max-width: 900px; text-align: center; }

        header { margin-bottom: 40px; }
        h1 { font-size: 3rem; font-weight: 800; margin-bottom: 10px; }
        h1 span { 
            background: linear-gradient(90deg, #3B82F6, #10B981);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
        }
        header p { color: #8b949e; font-size: 1.1rem; }

        .search-box { display: flex; gap: 12px; margin-bottom: 40px; justify-content: center; }
        
        input {
            flex: 0.7;
            background: rgba(13, 23, 38, 0.6);
            border: 1px solid rgba(88, 166, 255, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 1.1rem;
            padding: 15px 20px;
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: var(--accent-color); box-shadow: 0 0 15px var(--accent-glow); }

        button {
            background: linear-gradient(90deg, #2563EB, #3B82F6);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0 35px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--accent-glow);
        }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.7); }
        button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .dashboard { display: flex; flex-direction: column; gap: 24px; text-align: left; }
        
        .card {
            background: rgba(22, 27, 34, 0.4);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .score-card { text-align: center; }
        .score-card h2 { font-size: 1.2rem; color: #8b949e; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 20px; }
        
        /* CHART CSS */
        .chart-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 20px auto;
        }
        .score-overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 42px;
            font-weight: bold;
            font-family: 'JetBrains Mono', monospace;
        }
        
        .high { color: var(--terminal-green); text-shadow: 0 0 20px rgba(63, 185, 80, 0.4); }
        .medium { color: var(--warning-yellow); text-shadow: 0 0 20px rgba(227, 179, 65, 0.4); }
        .low { color: var(--danger-red); text-shadow: 0 0 20px rgba(255, 74, 74, 0.4); }

        .modules { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        @media (max-width: 768px) { .modules { grid-template-columns: 1fr; } }

        .module-card h3 { font-size: 1.1rem; margin-bottom: 15px; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
        .module-card ul { list-style: none; padding: 0; }
        .module-card li {
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: rgba(0,0,0,0.4);
            border-left: 4px solid transparent;
            font-size: 0.95rem;
        }
        
        .li-success { border-left-color: var(--terminal-green); color: #e6edf3; }
        .li-warning { border-left-color: var(--warning-yellow); color: #e6edf3; }
        .li-danger { border-left-color: var(--danger-red); color: #ff7b72; font-weight: bold; }

        .terminal-card { background: #010409; border: 1px solid rgba(63, 185, 80, 0.3); border-radius: 12px; padding: 20px; overflow-x: auto; }
        pre { color: var(--terminal-green); font-family: 'JetBrains Mono', monospace; font-size: 13px; }
        
        .loader-container { text-align: center; margin-top: 40px; }
        .spinner { border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--accent-color); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 20px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Sovereign <span>Cyber-Shield</span></h1>
            <p>Enterprise-Grade Security & Brand Protection for MSMEs</p>
        </header>

        <div class="search-box">
            <input type="text" id="target" placeholder="Enter Business Domain (e.g., scanme.nmap.org)" autocomplete="off">
            <button id="scan-btn" onclick="startScan()">Analyze Risk</button>
        </div>

        <div id="loader" class="hidden loader-container">
            <div class="spinner"></div>
            <p style="color: #8b949e; font-size: 1.1rem;">Running Threat Intelligence & Infrastructure Scan...</p>
        </div>

        <div id="result-container" class="hidden dashboard">
            
            <div class="card score-card">
                <h2>Cyber-Resilience Score</h2>
                <div class="chart-container">
                    <canvas id="scoreChart"></canvas>
                    <div id="score-text" class="score-overlay">--</div>
                </div>
                <p id="score-message" style="margin-top: 15px; font-weight: 600;"></p>
            </div>

            <div class="modules">
                <div class="card module-card">
                    <h3>🌐 Web-Surface Exposures</h3>
                    <ul id="web-output"></ul>
                </div>
                <div class="card module-card">
                    <h3>🛡️ Brand Impersonation</h3>
                    <ul id="brand-output"></ul>
                </div>
            </div>

            <div class="card terminal-card">
                <h3>🖥️ Raw Infrastructure Data</h3>
                <pre id="output"></pre>
            </div>
        </div>
    </div>

    <script>
        let scoreChartInstance = null;

        async function startScan() {
            const target = document.getElementById('target').value;
            const btn = document.getElementById('scan-btn');
            const loader = document.getElementById('loader');
            const resultContainer = document.getElementById('result-container');
            
            const output = document.getElementById('output');
            const scoreText = document.getElementById('score-text');
            const scoreMessage = document.getElementById('score-message');
            const webOutput = document.getElementById('web-output');
            const brandOutput = document.getElementById('brand-output');

            if (!target) {
                alert("Please enter a target domain!");
                return;
            }

            btn.disabled = true;
            loader.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            webOutput.innerHTML = '';
            brandOutput.innerHTML = '';

            try {
                const response = await fetch('/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target: target })
                });

                const data = await response.json();

                loader.classList.add('hidden');
                resultContainer.classList.remove('hidden');

                if (response.ok) {
                    let color = '#ff4a4a'; 
                    let statusClass = 'low';
                    
                    if (data.score >= 80) {
                        color = '#3fb950'; 
                        statusClass = 'high';
                        scoreMessage.textContent = "✅ Excellent: Your digital storefront is highly resilient.";
                        scoreMessage.style.color = color;
                    } else if (data.score >= 50) {
                        color = '#e3b341'; 
                        statusClass = 'medium';
                        scoreMessage.textContent = "⚠️ Warning: Multiple vulnerabilities found. Action required.";
                        scoreMessage.style.color = color;
                    } else {
                        scoreMessage.textContent = "🚨 Critical Danger: Business infrastructure is severely compromised.";
                        scoreMessage.style.color = color;
                    }

                    scoreText.textContent = data.score;
                    scoreText.className = `score-overlay ${statusClass}`;

                    // RENDER THE CHART
                    renderChart(data.score, color);

                    data.web_surface.forEach(item => {
                        const li = document.createElement('li');
                        li.textContent = item;
                        if(item.includes("CRITICAL")) li.className = "li-danger";
                        else if(item.includes("WARNING")) li.className = "li-warning";
                        else li.className = "li-success";
                        webOutput.appendChild(li);
                    });

                    data.brand_protection.forEach(item => {
                        const li = document.createElement('li');
                        li.textContent = item;
                        if(item.includes("DANGER")) li.className = "li-danger";
                        else li.className = "li-success";
                        brandOutput.appendChild(li);
                    });

                    output.textContent = data.nmap_results;

                } else {
                    alert(`Scan Failed: ${data.error}`);
                    loader.classList.add('hidden');
                }
            } catch (error) {
                alert("Could not connect to the scanning server. Please try again.");
                console.error("Fetch Error:", error);
            } finally {
                btn.disabled = false;
            }
        }

        function renderChart(score, colorCode) {
            const ctx = document.getElementById('scoreChart').getContext('2d');
            
            if (scoreChartInstance) {
                scoreChartInstance.destroy();
            }

            scoreChartInstance = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    datasets: [{
                        data: [score, 100 - score],
                        backgroundColor: [colorCode, 'rgba(255, 255, 255, 0.05)'],
                        borderWidth: 0,
                        cutout: '85%',
                        borderRadius: 5
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { animateScale: true, animateRotate: true },
                    plugins: { tooltip: { enabled: false } }
                }
            });
        }
    </script>
</body>
</html>
