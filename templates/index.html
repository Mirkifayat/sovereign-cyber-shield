<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sovereign Cyber-Shield | Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="lp-container">
        <h1 class="hero-title">Protect your business.</h1>
        <div class="search-box-container">
            <input type="text" id="target" placeholder="www.yourbusiness.com" autocomplete="off">
            <button id="scan-btn" onclick="startScan()">Analyze Risk</button>
        </div>

        <div id="loader" class="hidden loader-container">
            <div class="spinner"></div>
            <p id="loader-text">Initializing scanning engine...</p>
        </div>

        <div id="result-container" class="hidden dashboard">
            <div class="card score-card">
                <h2>CYBER-RESILIENCE SCORE</h2>
                <div class="chart-container">
                    <canvas id="scoreChart"></canvas>
                    <div id="score-text" class="score-overlay">--</div>
                </div>
                <p id="score-message"></p>
            </div>

            <div class="modules">
                <div class="card module-card">
                    <h3>🌐 Web-Surface Exposures</h3>
                    <ul id="web-output"></ul>
                </div>
                <div class="card module-card">
                    <h3>🛡️ Brand Impersonation</h3>
                    <ul id="brand-output"></ul>
                </div>
            </div>

            <div class="card geo-card">
                <h3>📍 Server Geo-Intelligence</h3>
                <div class="geo-grid" id="geo-grid"></div>
            </div>

            <div class="card roadmap-card">
                <h3>🛠️ Vulnerability Action Plan</h3>
                <ul id="action-output"></ul>
            </div>

            <div class="card terminal-card">
                <h3>🖥️ Raw Infrastructure Data</h3>
                <pre id="output"></pre>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
